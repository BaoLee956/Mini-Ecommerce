<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Ecommerce - Đặt hàng</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid vh-100">
        <div class="row h-100">
            <!-- Cart Section (20%) -->
            <div class="col-3 bg-light border-end p-3" id="cart-section">
                <h4 class="mb-3">
                    <i class="fas fa-shopping-cart"></i> Giỏ hàng
                </h4>
                <div id="cart-items" class="mb-3">
                    <!-- Cart items will be added here -->
                </div>
                <div class="mt-auto">
                    <button id="order-btn" class="btn btn-success w-100" disabled>
                        <i class="fas fa-check"></i> Đặt hàng
                    </button>
                </div>
            </div>

            <!-- Products Section (80%) -->
            <div class="col-9 p-3" id="products-section">
                <h4 class="mb-3">
                    <i class="fas fa-box"></i> Sản phẩm
                </h4>

                <!-- Search Section -->
                <div class="row mb-3">
                    <div class="col-md-8">
                        <div class="input-group">
                            <input type="text" id="search-input" class="form-control" placeholder="Tìm kiếm sản phẩm...">
                            <button id="search-btn" class="btn btn-primary">
                                <i class="fas fa-search"></i> Tìm kiếm
                            </button>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div id="pagination-info" class="text-muted mt-2">
                            <!-- Pagination info will be shown here -->
                        </div>
                    </div>
                </div>

                <!-- Pagination Controls -->
                <div class="d-flex justify-content-center mb-3" id="pagination-controls">
                    <!-- Pagination buttons will be added here -->
                </div>

                <!-- Products Grid -->
                <div id="products-grid" class="row">
                    <!-- Products will be loaded here -->
                </div>

                <!-- Loading Spinner -->
                <div id="loading-spinner" class="text-center d-none">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="api.js"></script>
    <script src="app.js"></script>
</body>
</html>
